name: cikon_supervisor_adapters_network
version: "1.0.0"
description: "Supervisor network adapter - uplink (WiFi, Ethernet, Thread) + MQTT, HTTP, SNTP, mDNS, OTA services"
license: MIT
url: https://github.com/pwilga/cikon-iot-solution
maintainers:
  - "Piotr Wilga <pwilga@gmail.com>"

dependencies:
  idf: ">=5.0"
  cikon_supervisor:
    git: "https://github.com/pwilga/cikon-iot-solution.git"
    path: components/cikon_supervisor
  cikon_config:
    git: "https://github.com/pwilga/cikon-iot-solution.git"
    path: components/cikon_config
  cikon_core:
    git: "https://github.com/pwilga/cikon-iot-solution.git"
    path: components/cikon_core
  cikon_helpers:
    git: "https://github.com/pwilga/cikon-iot-solution.git"
    path: components/cikon_helpers
  cikon_http:
    git: "https://github.com/pwilga/cikon-iot-solution.git"
    path: components/cikon_http
  cikon_inet_common:
    git: "https://github.com/pwilga/cikon-iot-solution.git"
    path: components/cikon_inet_common
  cikon_mqtt:
    git: "https://github.com/pwilga/cikon-iot-solution.git"
    path: components/cikon_mqtt
  cikon_wifi:
    git: "https://github.com/pwilga/cikon-iot-solution.git"
    path: components/cikon_wifi
    matches:
      - if: "$CONFIG{NETWORK_UPLINK_WIFI} == True"
  # Ethernet drivers come from the component registry - pulled only with the Ethernet uplink
  cikon_ethernet:
    git: "https://github.com/pwilga/cikon-iot-solution.git"
    path: components/cikon_ethernet
    matches:
      - if: "$CONFIG{NETWORK_UPLINK_ETHERNET} == True"
  cikon_thread_common:
    git: "https://github.com/pwilga/cikon-iot-solution.git"
    path: components/cikon_thread_common
    matches:
      - if: "$CONFIG{NETWORK_UPLINK_THREAD} == True"
  cikon_tcp_ota:
    git: "https://github.com/pwilga/cikon-iot-solution.git"
    path: components/cikon_tcp_ota
  cikon_tcp_monitor:
    git: "https://github.com/pwilga/cikon-iot-solution.git"
    path: components/cikon_tcp_monitor
