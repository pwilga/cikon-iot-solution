name: cikon_thread_common
version: "0.1.0"
description: "Shared utilities for Cikon Thread adapters"
license: MIT
url: https://github.com/pwilga/cikon-iot-solution
maintainers:
  - "Piotr Wilga <pwilga@gmail.com>"

dependencies:
  idf: ">=6.0"
  cikon_supervisor:
    git: "https://github.com/pwilga/cikon-iot-solution.git"
    path: components/cikon_supervisor
  cikon_helpers:
    git: "https://github.com/pwilga/cikon-iot-solution.git"
    path: components/cikon_helpers
  espressif/esp_ot_cli_extension:
    version: ">=2.0.0"
    matches:
      - if: "$CONFIG{ENABLE_SUPERVISOR_THREAD_BORDER_ROUTER} == True"
      - if: "$CONFIG{NETWORK_UPLINK_THREAD} == True"
